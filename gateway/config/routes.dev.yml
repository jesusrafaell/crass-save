gateway:
  routes:
    # - target: https://user-assistance-dev.yourappssistance.com
    - target: http://localhost:4005
      contexts:
        - name: Users
          context: /api/v1/users
        - name: Auth
          context: /api/v1/auth
        - name: Verify Token
          context: /api/v1/verify-token
        - name: File
          context: /api/v1/file
        - name: Version
          context: /api/v1/version

    - target: https://api-dev.yourappssistance.com
      contexts:
        - name: Drive Assist
          context: /api/v1/assistance
        - name: Drive Assist V2
          context: /api/v2/assistance
