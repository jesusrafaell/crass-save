syntax = "proto3";

package fcm;

option go_package = "crashsaver/fcm/proto";

service ServiceMsg {
    rpc SendMessageFCM(SendMessageFCMRequest) returns (SendMessageFCMResponse);
    rpc SendMessgeWS(SendMessageWSRequest) returns (BaseResponse);
}

message MessageWS {
    string to = 1;
    string msg = 2;
}

message SendMessageWSRequest {
    MessageWS ws = 1;
}

message BaseResponse {
    bool ok = 1;
}


message MessageFCM {
    string fcmToken = 1;
    string title = 2;
    string message = 3;
    string sound = 4;
    string channel = 5;
}

message SendMessageFCMRequest {
    MessageFCM fcm = 1;
}

message SendMessageFCMResponse {
    MessageFCM fcm = 1;
    bool ok = 2;
}
